
name: Build Bulwark Webmail

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: bulwark-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/bulwarkmail/webmail/releases/latest --jq .tag_name)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing version
        id: check
        run: |
          if docker buildx imagetools inspect \
            "$IMAGE:${{ steps.release.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: bulwarkmail/webmail
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Get source commit
        id: source
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.check.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/web
            NEXT_PUBLIC_LOCALE_PREFIX=always
            GIT_COMMIT=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
